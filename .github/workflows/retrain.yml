# Periodic cloud retraining (problem statement: "Monitoring & Maintenance").
# Requires repository secrets SUPABASE_URL, SUPABASE_SECRET_KEY, DATABASE_URL.
# New models are promoted to `active` only if they pass the gate in voltsplit/publish.py.
name: retrain-models

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: model-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model-training/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        working-directory: model-training
      - name: Train, evaluate, export and publish
        working-directory: model-training/src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m voltsplit.pipeline --publish
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: model-training/reports/evaluation.json
